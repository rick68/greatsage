[dev-dependencies]
assert_cmd = { version = "2.2.1", features = ["color-auto"] }
predicates = "3.1.4"
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.102"
bevy = { version = "0.18.1", default-features = false, features = [
    "bevy_state",
    "std",
] }
bevy-tokio-tasks = "0.18.0"
bevy_ratatui = "0.11.1"
chrono = { version = "0.4.44", default-features = false, features = ["now"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
clap-help = "1.5.0"
crossbeam-channel = "0.5.15"
dotenvy = "0.15.7"
glob = "0.3.3"
ratatui = "0.30.0"
regex = "1.12.3"
serde = "1.0.228"
log = "0.4"
toml = "0.8"
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
strum = { version = "0.28.0", features = ["derive"] }
termimad = "0.34.1"
tokio = { version = "1.52.1", features = ["macros", "rt"] }
tokio-util = "0.7.18"
unicode-width = "0.2.2"
walkdir = "2.5.0"
yoagent = { version = "0.8.0", features = ["openapi"] }

[features]
default = []

[lints.clippy]
diverging_sub_expression = "allow"
let_underscore_future = "allow"

[package]
categories = []
description = "Rimuru's Unique Skill, you know the one."
edition = "2024"
keywords = []
license = "MIT OR Apache-2.0"
name = "greatsage"
version = "0.0.0"

[profile.dev.package.backtrace]
opt-level = 3
