[package]
name = "greatsage"
version = "0.0.0"
edition = "2024"
description = "Rimuru's Unique Skill, you know the one."
license = "MIT OR Apache-2.0"
categories = []
keywords = []

[build-dependencies]
build-info-build = { version = "0.0.44", features = ["git2"] }

[dependencies]
ansi-to-tui = "8.0.1"
async-trait = "0.1.89"
anyhow = "1.0.102"
backon = "1.6.0"
bevy = { version = "0.18.1", default-features = false, features = ["bevy_state", "std"] }
bevy-tokio-tasks = "0.18.0"
bevy_ratatui = "0.11.1"
build-info = { version = "0.0.44", features = ["oxford-comma"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = { version = "4.6.2", features = ["unstable-dynamic"] }
dirs = "6.0.0"
crossbeam-channel = "0.5.15"
dotenvy = "0.15.7"
git2 = "0.20.4"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
strum = { version = "0.28.0", features = ["derive"] }
termimad = "0.34.1"
tokio = { version = "1.52.1", features = ["macros", "rt"] }
tokio-util = "0.7.18"
thiserror = "2.0.18"
toml = "1.1.2"
unicode-width = "0.2.2"
url = "2.5.8"
yoagent = { version = "0.7.5", features = ["openapi"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
temp_env_vars = "0.2.1"
tempfile = "3.27.0"

[features]
default = []

[lints.clippy]
diverging_sub_expression = "allow"
let_underscore_future = "allow"

[profile.dev.package.backtrace]
opt-level = 3
