[dev-dependencies]
temp_env_vars = "0.2.1"

[dependencies]
async-trait = "0.1.89"
bevy = { version = "0.19.0", default-features = false, features = [
    "bevy_state",
    "std",
] }
bevy-tokio-tasks = "0.19.0"
bevy_brp_extras = { version = "0.20.1", optional = true }
# crates.io 0.11.1 is Bevy 0.18-only; pin PR #98 (Bevy 0.19) until published.
# https://github.com/ratatui/bevy_ratatui/pull/98
bevy_ratatui = { git = "https://github.com/apekros/bevy_ratatui", rev = "556ac6b7bb896fdd91722b01e651dfc4a8ddc5a2", default-features = false, features = [
    "async_executor",
    "crossterm",
    "mouse", # EnableMouseCapture + MousePlugin (click focus / wheel scroll in tui)
    "std",
] }
ratatui = "0.30"
cfg-if = "1.0.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
clap-help = "1.5.0"
colored = "3.1.1"
config = "0.15.24"
crossbeam-channel = "0.5.15"
dirs = "6.0.0"
dotenvy = "0.15.7"
inquire = "0.9.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
shell-words = "1.1.1"
strum = { version = "0.28.0", features = ["derive"] }
termimad = "0.34.1"
thiserror = "2.0.18"
toml_edit = "0.25.12"
tokio = { version = "1.52.3", features = ["macros", "process", "rt-multi-thread", "time"] }
tokio-util = "0.7.18"
unicode-width = "0.2.2"
url = { version = "2.5.8", features = ["serde"] }
yoagent = { version = "0.8.4", features = ["openapi"] }

[features]
default = []
dev = [
    "bevy/bevy_dev_tools",
    "bevy/track_location",
]
dev_native = [
    "bevy/bevy_remote",
    "bevy/hotpatching",
    "dep:bevy_brp_extras",
    "dev",
]

[lints.clippy]
diverging_sub_expression = "allow"
let_underscore_future = "allow"
too_many_arguments = "allow"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(bevy_lint)"] }

[package]
categories = []
description = "Rimuru's Unique Skill, you know the one."
edition = "2024"
keywords = []
license = "MIT OR Apache-2.0"
name = "greatsage"
repository = "https://github.com/rick68/greatsage"
version = "0.0.6"

[package.metadata.bevy_cli.dev]
features = [ "dev_native" ]

[package.metadata.bevy_cli.release]
default-features = false

[profile.ci]
inherits = "dev"
opt-level = 0
debug = "line-tables-only"
codegen-units = 4

[profile.ci.package."*"]
opt-level = 0

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[target.'cfg(target_os = "linux")'.dependencies]
openssl = { version = "0.10.80", features = ["vendored"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
signal-hook = "0.4.4"
signal-hook-tokio = { version = "0.4.0", features = ["futures-v0_3"] }
